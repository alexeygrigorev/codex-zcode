name: ZCode Release

on:
  push:
    tags:
      - "zcode-*-codex-*"
  pull_request:
  workflow_dispatch:
    inputs:
      validate_runtime:
        description: Run targeted/full runtime tests and lint instead of building release artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zcode-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.validate_runtime)
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: zcodex-linux-amd64

          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: zcodex-linux-arm64

    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: zcode-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Use checksum-verified prebuilt rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Codex CLI with ZCode integration
        run: cargo build --locked --release --target ${{ matrix.target }} -p codex-cli --bin zcodex

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/zcodex --version

      # The release profile keeps full DWARF plus the symbol table in the
      # binary (~85% of its size). Archive both into a sidecar artifact for
      # symbolication, then ship a fully stripped binary zstd-compressed
      # (extract with `tar --zstd -xf`).
      - name: Split debug symbols, strip, and compress binary
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/zcodex"
          objcopy --only-keep-debug "$bin" "../${{ matrix.asset_name }}.debug"
          strip --strip-all "$bin"
          cp "$bin" "../${{ matrix.asset_name }}"
          "../${{ matrix.asset_name }}" --version
          tar --use-compress-program='zstd -19 -T0' \
            -cf "../${{ matrix.asset_name }}.tar.zst" \
            -C .. "${{ matrix.asset_name }}"
          ls -lh "../${{ matrix.asset_name }}".debug "../${{ matrix.asset_name }}".tar.zst

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-tar-zst
          path: ${{ matrix.asset_name }}.tar.zst
          if-no-files-found: error

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-symbols
          path: ${{ matrix.asset_name }}.debug
          if-no-files-found: error

  validate-runtime:
    name: Validate runtime
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.validate_runtime)
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recover space on this disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/setup-ci

      - name: Install Linux workspace build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          pkg-config --atleast-version=1.28 gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.143

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Record source, tools and available resources
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD 'HEAD^{tree}' > ci-evidence/source.txt
          cargo -vV > ci-evidence/rust.txt
          cargo nextest --version > ci-evidence/nextest.txt
          df -h
          free -m

      - name: Use checksum-verified prebuilt rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build workspace executables required by integration tests
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo build --locked --workspace --bins --profile dev-small --jobs 2 2>&1 | tee ../ci-evidence/test-binaries.log
          # Upstream test fixtures still resolve the CLI by its upstream name.
          ln -s zcodex "$CARGO_TARGET_DIR/dev-small/codex"
          echo "CARGO_BIN_EXE_codex=$CARGO_TARGET_DIR/dev-small/zcodex" >> "$GITHUB_ENV"

      - name: Test changed runtime project
        run: |
          set -o pipefail
          just test -p codex-core --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 2>&1 | tee ci-evidence/core-tests.log
          cp "$CARGO_TARGET_DIR/nextest/local/junit.xml" ci-evidence/core-junit.xml

      - name: Test full runtime workspace
        run: |
          set -o pipefail
          just test --workspace --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 2>&1 | tee ci-evidence/workspace-tests.log
          cp "$CARGO_TARGET_DIR/nextest/local/junit.xml" ci-evidence/workspace-junit.xml

      - name: Apply required scoped lint fixes
        run: just fix -p codex-core --profile dev-small --jobs 2

      - name: Apply final formatting and require an unchanged source tree
        run: |
          just fmt
          git diff --exit-code

      - name: Retain actual validation evidence and any suggested fixes
        if: always()
        run: |
          mkdir -p ci-evidence
          git diff --binary > ci-evidence/suggested-fixes.patch
          if [[ -f "$CARGO_TARGET_DIR/nextest/local/junit.xml" ]]; then
            cp "$CARGO_TARGET_DIR/nextest/local/junit.xml" ci-evidence/latest-junit.xml
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-validation-evidence
          path: ci-evidence
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/zcode-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: mkdir -p release

      - name: Add project documentation
        run: cp ABOUT.md release/ABOUT.md

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: zcodex-linux-amd64-tar-zst
          path: release

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: zcodex-linux-arm64-tar-zst
          path: release

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release
          version="${GITHUB_REF_NAME#zcode-}"
          printf '%s\n' "$version" > release/VERSION
          sha256sum release/* > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex ZCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/zcodex-linux-amd64.tar.zst
            release/zcodex-linux-arm64.tar.zst
            release/ABOUT.md
            release/VERSION
            release/SHA256SUMS
