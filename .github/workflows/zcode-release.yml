name: ZCode Release

on:
  push:
    tags:
      - "zcode-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcode-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: zcodex-linux-amd64

          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: zcodex-linux-arm64

    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: zcode-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build Codex CLI with ZCode integration
        run: cargo build --locked --release --target ${{ matrix.target }} -p codex-cli --bin zcodex

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/zcodex --version

      - name: Stage binary
        shell: bash
        run: cp "./target/${{ matrix.target }}/release/zcodex" "../${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/zcode-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: mkdir -p release

      - name: Add project documentation
        run: cp ABOUT.md release/ABOUT.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print
          find artifacts -type f -exec cp {} release/ \;
          version="${GITHUB_REF_NAME#zcode-v}"
          printf '%s\n' "$version" > release/VERSION
          sha256sum release/* > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex ZCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/zcodex-linux-amd64
            release/zcodex-linux-arm64
            release/ABOUT.md
            release/VERSION
            release/SHA256SUMS
