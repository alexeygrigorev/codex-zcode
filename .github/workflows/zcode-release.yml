name: ZCode Release

on:
  push:
    tags:
      - "zcode-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcode-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ZCode integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: zcode-integration

      - name: Format ZCode extension
        run: cargo fmt --check -p codex-zcode

      - name: Check ZCode extension
        run: cargo check --locked -p codex-zcode

      - name: Clippy ZCode extension
        run: cargo clippy --locked -p codex-zcode -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: codex-zcode-linux-amd64

          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: codex-zcode-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: zcode-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build Codex CLI with ZCode integration
        run: cargo build --locked --release --target ${{ matrix.target }} -p codex-cli --bin codex

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/codex --version

      - name: Stage binary
        shell: bash
        run: cp "./target/${{ matrix.target }}/release/codex" "../${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/zcode-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -print
          find artifacts -type f -exec cp {} release/ \;
          version="${GITHUB_REF_NAME#zcode-v}"
          printf '%s\n' "$version" > release/VERSION
          sha256sum release/* > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex ZCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/codex-zcode-linux-amd64
            release/codex-zcode-linux-arm64
            release/VERSION
            release/SHA256SUMS
