name: ZCode Release

on:
  push:
    tags:
      - "zcode-*-codex-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcode-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: zcodex-linux-amd64

          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: zcodex-linux-arm64

    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: zcode-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build Codex CLI with ZCode integration
        run: cargo build --locked --release --target ${{ matrix.target }} -p codex-cli --bin zcodex

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/zcodex --version

      # The release profile keeps full DWARF plus the symbol table in the
      # binary (~85% of its size). Archive both into a sidecar artifact for
      # symbolication, then ship a fully stripped binary zstd-compressed
      # (extract with `tar --zstd -xf`).
      - name: Split debug symbols, strip, and compress binary
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/zcodex"
          objcopy --only-keep-debug "$bin" "../${{ matrix.asset_name }}.debug"
          strip --strip-all "$bin"
          cp "$bin" "../${{ matrix.asset_name }}"
          "../${{ matrix.asset_name }}" --version
          tar --use-compress-program='zstd -19 -T0' \
            -cf "../${{ matrix.asset_name }}.tar.zst" \
            -C .. "${{ matrix.asset_name }}"
          ls -lh "../${{ matrix.asset_name }}".debug "../${{ matrix.asset_name }}".tar.zst

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-tar-zst
          path: ${{ matrix.asset_name }}.tar.zst
          if-no-files-found: error

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-symbols
          path: ${{ matrix.asset_name }}.debug
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/zcode-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: mkdir -p release

      - name: Add project documentation
        run: cp ABOUT.md release/ABOUT.md

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: zcodex-linux-amd64-tar-zst
          path: release

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: zcodex-linux-arm64-tar-zst
          path: release

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release
          version="${GITHUB_REF_NAME#zcode-}"
          printf '%s\n' "$version" > release/VERSION
          sha256sum release/* > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex ZCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/zcodex-linux-amd64.tar.zst
            release/zcodex-linux-arm64.tar.zst
            release/ABOUT.md
            release/VERSION
            release/SHA256SUMS
