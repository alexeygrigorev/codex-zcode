name: ZCode Release

on:
  push:
    tags:
      - "zcode-*-codex-*"
  pull_request:
  workflow_dispatch:
    inputs:
      validate_runtime:
        description: Run targeted/full runtime tests and lint instead of building release artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zcode-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.validate_runtime)
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: zcodex-linux-amd64

          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: zcodex-linux-arm64

    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: zcode-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Use checksum-verified prebuilt rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Codex CLI with ZCode integration
        run: cargo build --locked --release --target ${{ matrix.target }} -p codex-cli --bin zcodex

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/zcodex --version

      # The release profile keeps full DWARF plus the symbol table in the
      # binary (~85% of its size). Archive both into a sidecar artifact for
      # symbolication, then ship a fully stripped binary zstd-compressed
      # (extract with `tar --zstd -xf`).
      - name: Split debug symbols, strip, and compress binary
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/zcodex"
          objcopy --only-keep-debug "$bin" "../${{ matrix.asset_name }}.debug"
          strip --strip-all "$bin"
          cp "$bin" "../${{ matrix.asset_name }}"
          "../${{ matrix.asset_name }}" --version
          tar --use-compress-program='zstd -19 -T0' \
            -cf "../${{ matrix.asset_name }}.tar.zst" \
            -C .. "${{ matrix.asset_name }}"
          ls -lh "../${{ matrix.asset_name }}".debug "../${{ matrix.asset_name }}".tar.zst

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-tar-zst
          path: ${{ matrix.asset_name }}.tar.zst
          if-no-files-found: error

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-symbols
          path: ${{ matrix.asset_name }}.debug
          if-no-files-found: error

  validate-runtime:
    name: Validate runtime
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.validate_runtime)
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recover space on this disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/setup-ci

      - name: Install Linux workspace build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          pkg-config --atleast-version=1.28 gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0
          # The voice host's playout pipeline needs these runtime elements, not just headers.
          # gst-inspect-1.0 only inspects its last argument, so check each element separately.
          for element in rtpjitterbuffer rtpopusdepay opusdec audioconvert audioresample capsfilter; do
            gst-inspect-1.0 --exists "${element}" || { echo "missing GStreamer element: ${element}" >&2; exit 1; }
          done

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.143

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Record source, tools and available resources
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD 'HEAD^{tree}' > ci-evidence/source.txt
          cargo -vV > ci-evidence/rust.txt
          cargo nextest --version > ci-evidence/nextest.txt
          df -h
          free -m

      - name: Use checksum-verified prebuilt rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build workspace executables required by integration tests
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo build --locked --workspace --bins --profile dev-small --jobs 2 2>&1 | tee ../ci-evidence/test-binaries.log
          # Upstream test fixtures still resolve the CLI by its upstream name.
          ln -s zcodex "$CARGO_TARGET_DIR/dev-small/codex"
          echo "CARGO_BIN_EXE_codex=$CARGO_TARGET_DIR/dev-small/zcodex" >> "$GITHUB_ENV"

      - name: Test opt-in ZCode phase diagnostics (exact five)
        run: |
          set -euo pipefail
          rm -f codex-rs/target/nextest/local/junit.xml
          just test -p codex-core --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 \
            -E 'binary_id(codex-core) & (test(=client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_default_off_and_non_one_flags_emit_nothing) | test(=client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_enabled_has_exact_closed_schema) | test(=client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_warm_fallback_shares_one_sixteen_record_budget) | test(=client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_unknown_frame_never_echoes_payload_or_secrets) | test(=client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_child_wait_is_not_descendant_or_provider_success))' 2>&1 | tee ci-evidence/zcode-phase-diagnostics-tests.log
          cp codex-rs/target/nextest/local/junit.xml ci-evidence/zcode-phase-diagnostics-junit.xml
          python3 - <<'PY_GUARD'
          import collections
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          expected = ['client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_default_off_and_non_one_flags_emit_nothing', 'client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_enabled_has_exact_closed_schema', 'client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_warm_fallback_shares_one_sixteen_record_budget', 'client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_unknown_frame_never_echoes_payload_or_secrets', 'client::zcode_phase_diagnostics::tests::zcode_bridge_diagnostics_child_wait_is_not_descendant_or_provider_success']
          path = pathlib.Path('ci-evidence/zcode-phase-diagnostics-junit.xml')
          root = ET.parse(path).getroot()
          cases = list(root.iter('testcase'))
          actual = [case.attrib.get('name') for case in cases]
          assert collections.Counter(actual) == collections.Counter(expected), (actual, expected)
          assert len(cases) == 5
          rejected = {'failure', 'error', 'skipped', 'flakyFailure', 'flakyError', 'rerunFailure', 'rerunError'}
          assert not any(node.tag in rejected for node in root.iter())
          for node in root.iter():
              for field in ('failures', 'errors', 'skipped', 'disabled'):
                  if field in node.attrib:
                      assert int(node.attrib[field]) == 0, (field, node.attrib[field])
          pathlib.Path('ci-evidence/zcode-phase-diagnostics-result.json').write_text(
              json.dumps({'tests': 5, 'passed': 5, 'skipped': 0, 'names': actual}, sort_keys=True) + '\n'
          )
          PY_GUARD

      # Run the previously failing PR62 tests and the unified-exec producer
      # regressions first, so their evidence exists before the long suites.
      # This only selects tests. When it passes, the unchanged suites below run
      # everything; when it fails, they are skipped and the job fails early.
      - name: Test focused PR62 regressions
        run: |
          set -o pipefail
          just test -p codex-core -p codex-app-server -p codex-exec-server -p codex-tui \
            --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 \
            -E '(binary_id(codex-core) & (test(=unified_exec::async_watcher::tests::transcript_is_exact_after_delayed_subscription_and_watcher_lag) | test(=unified_exec::process_tests::local_output_backpressures_a_stalled_consumer_without_losing_chunks) | test(=unified_exec::process_manager::tests::failed_initial_end_for_unstored_process_uses_fallback_output)))
              | (binary_id(codex-app-server::all) & (test(=suite::v2::command_exec::command_exec_process_ids_are_connection_scoped_and_disconnect_terminates_process) | test(=suite::v2::thread_resume::thread_goal_keeps_original_root_until_external_objective_edit) | test(=suite::v2::turn_interrupt::turn_interrupt_with_pending_steer_aborts_and_thread_stays_usable) | test(=suite::v2::turn_steer::turn_steer_and_interrupt_work_on_resumed_thread)))
              | (binary_id(codex-exec-server::exec_process) & (test(=shell_snapshot_v2_capture_failure_falls_back_and_retries::remote_pipe_recovery) | test(=shell_snapshot_v2_capture_failure_falls_back_and_retries::remote_tty_recovery) | test(=shell_snapshot_v2_filters_profile_exports_and_stays_in_memory::remote_sandbox)))
              | (binary_id(codex-tui) & test(/^app::tests::safety_buffering::safety_retry_(can_retry_a_first_turn_a_second_time|forks_after_the_previous_turn_and_uses_faster_settings|forks_first_turn_and_continues_without_duplicating_prompt|preserves_a_committed_steer_from_the_interrupted_turn|replays_older_interruption_notices)$/))' \
            2>&1 | tee ci-evidence/focused-tests.log
          cp codex-rs/target/nextest/local/junit.xml ci-evidence/focused-junit.xml

      # Fail early on the native UI surface while retaining every full suite below.
      - name: Test native bridge TUI regressions
        run: |
          set -o pipefail
          just test -p codex-core -p codex-tui --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 \
            -E 'binary_id(codex-tui) & (test(bridge_native) | test(bridge_tool_activity))' 2>&1 | tee ci-evidence/native-bridge-tui-tests.log
          cp codex-rs/target/nextest/local/junit.xml ci-evidence/native-bridge-tui-junit.xml

      - name: Test changed runtime project
        run: |
          set -o pipefail
          just test -p codex-core --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 2>&1 | tee ci-evidence/core-tests.log
          cp codex-rs/target/nextest/local/junit.xml ci-evidence/core-junit.xml

      - name: Test full runtime workspace
        run: |
          set -o pipefail
          just test --workspace --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 2>&1 | tee ci-evidence/workspace-tests.log
          cp codex-rs/target/nextest/local/junit.xml ci-evidence/workspace-junit.xml

      - name: Apply required scoped lint fixes
        run: just fix -p codex-core -p codex-linux-sandbox -p codex-tui --profile dev-small --jobs 2

      - name: Apply final formatting and require an unchanged source tree
        run: |
          just fmt
          git diff --exit-code

      # CI-only diagnostic artifact: reuse the validated executable; never build or publish a release here.
      - name: Stage validated diagnostic CLI artifact
        run: |
          set -euo pipefail
          mkdir ci-diagnostics
          bin="$CARGO_TARGET_DIR/dev-small/zcodex"
          test -f "$bin" && test ! -L "$bin"
          install -m 0755 "$bin" ci-diagnostics/zcodex
          rustc -vV > ci-diagnostics/RUSTC.txt
          cp ci-evidence/rust.txt ci-diagnostics/CARGO.txt
          cp ci-evidence/nextest.txt ci-diagnostics/NEXTEST.txt
          python3 - <<'PY_ARTIFACT'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          binary = pathlib.Path('ci-diagnostics/zcodex')
          with binary.open('rb') as stream:
              header = stream.read(20)
          assert header[:6] == b'\x7fELF\x02\x01' and int.from_bytes(header[18:20], 'little') == 62
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert re.fullmatch('[0-9a-f]{40}', source) and re.fullmatch('[0-9a-f]{40}', tree)
          assert source == os.environ['GITHUB_SHA']
          with binary.open('rb') as stream:
              binary_sha256 = hashlib.file_digest(stream, 'sha256').hexdigest()
          metadata = {
              'schema_version': 1,
              'purpose': 'CI-only opt-in phase-diagnostic binary; no release or adoption authority',
              'source_commit': source,
              'source_tree': tree,
              'event': os.environ['GITHUB_EVENT_NAME'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'platform': 'linux-amd64',
              'cargo_profile': 'dev-small',
              'binary_size': binary.stat().st_size,
              'binary_sha256': binary_sha256,
              'rustc_metadata': 'RUSTC.txt',
              'cargo_metadata': 'CARGO.txt',
              'nextest_metadata': 'NEXTEST.txt',
          }
          pathlib.Path('ci-diagnostics/SOURCE.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')
          PY_ARTIFACT
          (cd ci-diagnostics && sha256sum zcodex SOURCE.json RUSTC.txt CARGO.txt NEXTEST.txt > SHA256SUMS)

      - name: Upload CI-only Linux AMD64 diagnostic binary
        uses: actions/upload-artifact@v4
        with:
          name: zcodex-phase-diagnostics-linux-amd64-${{ github.sha }}
          path: ci-diagnostics
          retention-days: 3
          if-no-files-found: error

      - name: Retain actual validation evidence and any suggested fixes
        if: always()
        run: |
          mkdir -p ci-evidence
          git diff --binary > ci-evidence/suggested-fixes.patch
          if [[ -f codex-rs/target/nextest/local/junit.xml ]]; then
            cp codex-rs/target/nextest/local/junit.xml ci-evidence/latest-junit.xml
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-validation-evidence
          path: ci-evidence
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/zcode-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: mkdir -p release

      - name: Add project documentation
        run: cp ABOUT.md release/ABOUT.md

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: zcodex-linux-amd64-tar-zst
          path: release

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: zcodex-linux-arm64-tar-zst
          path: release

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release
          version="${GITHUB_REF_NAME#zcode-}"
          printf '%s\n' "$version" > release/VERSION
          sha256sum release/* > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Codex ZCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/zcodex-linux-amd64.tar.zst
            release/zcodex-linux-arm64.tar.zst
            release/ABOUT.md
            release/VERSION
            release/SHA256SUMS
