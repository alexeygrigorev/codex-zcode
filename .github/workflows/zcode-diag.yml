name: ZCode diag (temporary)

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  diag:
    name: Diag
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recover space on this disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/setup-ci

      - name: Install Linux workspace build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          pkg-config --atleast-version=1.28 gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.143

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Record source, tools and available resources
        run: |
          mkdir -p ci-evidence
          git rev-parse HEAD 'HEAD^{tree}' > ci-evidence/source.txt
          cargo -vV > ci-evidence/rust.txt
          cargo nextest --version > ci-evidence/nextest.txt
          df -h
          free -m

      - name: Try GNU coreutils
        run: |
          apt-cache policy coreutils-from-gnu | head -3
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-remove-essential coreutils-from-gnu coreutils-from-uutils- zsh build-essential-
          ls -l /usr/bin/cat; cat --version | head -1

      - name: Environment probes
        run: |
          set +e
          . /etc/os-release; echo "$PRETTY_NAME"; uname -r
          ls -l /usr/bin/cat /usr/bin/python3 /usr/bin/zsh /usr/bin/bwrap /bin/sh /usr/bin/env
          readlink -f /usr/bin/cat /usr/bin/python3 /bin/sh
          python3 --version; cat --version | head -2; zsh --version; bwrap --version
          bwrap --unshare-all --ro-bind / / --dev /dev true; echo "bwrap rc=$?"
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          which rg zsh python3; true

      - name: Use checksum-verified prebuilt rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build workspace executables required by integration tests
        working-directory: codex-rs
        run: |
          set -o pipefail
          cargo build --locked --workspace --bins --profile dev-small --jobs 2 2>&1 | tee ../ci-evidence/test-binaries.log
          # Upstream test fixtures still resolve the CLI by its upstream name.
          ln -s zcodex "$CARGO_TARGET_DIR/dev-small/codex"
          echo "CARGO_BIN_EXE_codex=$CARGO_TARGET_DIR/dev-small/zcodex" >> "$GITHUB_ENV"

      - name: Diagnose failing tests
        run: |
          set -o pipefail
          just test -p codex-core --features codex-core/bedrock --cargo-profile dev-small --build-jobs 2 --test-threads 2 --no-capture -E 'test(/zsh_fork/) | test(/network_rejection_preserves/) | test(/async_hook_finishing_while_idle/) | test(/snapshot_discovers_and_redacts/)' 2>&1 | tee ci-evidence/diag.log | tail -c 400000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-runtime-diagnostics
          path: ci-evidence
